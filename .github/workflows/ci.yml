name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SWIFTLINT_VERSION: 0.65.1
      # SHA-256 of portable_swiftlint.zip from the SwiftLint 0.65.1 GitHub release.
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      # Actions are pinned by commit SHA; the comment names the release it was taken from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "::error::no /Applications/Xcode_26*.app on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install SwiftLint
        run: |
          zip="$RUNNER_TEMP/swiftlint.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  ${zip}" | shasum -a 256 -c -
          unzip -q -o "$zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Check SwiftLint version
        run: test "$(swiftlint version)" = "$SWIFTLINT_VERSION"

      - name: Security checker self-test
        run: make security-selftest

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tests.xcresult
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Check entitlements of the release build
        run: make security
