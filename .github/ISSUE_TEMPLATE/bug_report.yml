name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.2"
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display
      options:
        - Built-in display
        - External monitor
        - Both
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Do not post passwords or other private clipboard contents.
